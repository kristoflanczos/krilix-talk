name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run desktop:pack

            - name: Publish release to public release repo
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: kristoflanczos/krilix-talk-releases
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Desktop release ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml